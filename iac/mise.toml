# `terragrunt hcl fmt` formats only .hcl, `tofu fmt` only .tf — both must run.

[tools]
scaleway   = "2.60.0"

[tasks.fmt]
description = "Format all .tf and .hcl files under iac/ (rewrites in place)"
dir = "{{config_root}}"
run = '''
tofu fmt -recursive .
terragrunt hcl fmt
'''

[tasks.pre-commit]
description = "Auto-format staged .tf/.hcl under iac/ and re-stage them"
dir = "{{config_root}}"
run = '''
tffiles=$("$MISE_MONOREPO_ROOT"/scripts/staged.sh .tf) || exit 1
hclfiles=$("$MISE_MONOREPO_ROOT"/scripts/staged.sh .hcl) || exit 1

if [ -n "$tffiles" ]; then
  echo "$tffiles" | while IFS= read -r f; do tofu fmt "$f"; git add "$f"; done
fi

if [ -n "$hclfiles" ]; then
  echo "$hclfiles" | while IFS= read -r f; do terragrunt hcl fmt --file="$f"; git add "$f"; done
fi
'''

# Terragrunt resolves `include "root"` by walking up, so every unit must be
# invoked from inside live/ — hence --working-dir rather than a `dir` per task.

[tasks.plan]
description = "Preview one live unit, e.g. `mise run //iac:plan dev/backend`"
dir = "{{config_root}}/live"
usage = 'arg "<unit>" help="Path of the unit under live/, e.g. shared or dev/backend"'
run = 'terragrunt --working-dir "$usage_unit" plan'

[tasks.apply]
description = "Apply one live unit, e.g. `mise run //iac:apply shared`. Creates billable resources."
dir = "{{config_root}}/live"
usage = 'arg "<unit>" help="Path of the unit under live/, e.g. shared or dev/backend"'
run = 'terragrunt --working-dir "$usage_unit" apply'

# Named shortcuts, one per live unit.

[tasks."plan:shared"]
description = "Preview the shared unit (state bucket, registry, Edge Services plan)"
dir = "{{config_root}}/live"
run = "terragrunt --working-dir shared plan"

[tasks."apply:shared"]
description = "Apply the shared unit. Creates billable resources."
dir = "{{config_root}}/live"
run = "terragrunt --working-dir shared apply"

[tasks."plan:dev-backend"]
description = "Preview dev/backend (VPC, PostgreSQL, Joke API container)"
dir = "{{config_root}}/live"
run = "terragrunt --working-dir dev/backend plan"

[tasks."apply:dev-backend"]
description = "Apply dev/backend. Creates billable resources."
dir = "{{config_root}}/live"
run = "terragrunt --working-dir dev/backend apply"

[tasks."plan:dev-frontend-deps"]
description = "Preview dev/frontend-deps (the Edge Services pipeline). Apply before dev/frontend."
dir = "{{config_root}}/live"
run = "terragrunt --working-dir dev/frontend-deps plan"

[tasks."apply:dev-frontend-deps"]
description = "Apply dev/frontend-deps. Creates the pipeline whose ID is the CNAME target."
dir = "{{config_root}}/live"
run = "terragrunt --working-dir dev/frontend-deps apply"

[tasks."plan:dev-frontend"]
description = "Preview dev/frontend (site bucket, CDN stages, custom domain)"
dir = "{{config_root}}/live"
run = "terragrunt --working-dir dev/frontend plan"

[tasks."apply:dev-frontend"]
description = "Apply dev/frontend. Needs the CNAME to resolve first."
dir = "{{config_root}}/live"
run = "terragrunt --working-dir dev/frontend apply"
