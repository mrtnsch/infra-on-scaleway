services:
  postgres:
    image: 'postgres:18-alpine'
    container_name: "joke-api-postgres"
    hostname: "joke-api-postgres"
    environment:
      - 'POSTGRES_DB=postgres'
      - 'POSTGRES_PASSWORD=postgres'
      - 'POSTGRES_USER=postgres'
    ports:
      - '5432:5432'
    volumes:
      - postgres_joke_api_data:/var/lib/postgresql
    networks:
      - postgres_joke_api_network

volumes:
  postgres_joke_api_data:

networks:
  postgres_joke_api_network:
