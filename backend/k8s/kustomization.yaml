apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: joke-api

resources:
- namespace.yaml
- configmap.yaml
- deployment.yaml
- service.yaml

# `mise run //backend:k8s-deploy <tag>` rewrites newTag, so the deployed build
# is a reviewable diff in git rather than a flag someone remembers to pass.
images:
- name: joke-api
  newName: rg.fr-par.scw.cloud/infra-on-scaleway/joke-api
  newTag: 0.0.1
