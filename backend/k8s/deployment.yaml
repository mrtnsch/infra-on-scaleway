apiVersion: apps/v1
kind: Deployment
metadata:
  name: joke-api
  labels:
    app.kubernetes.io/name: joke-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: joke-api
  strategy:
    rollingUpdate:
      # One node: the surge pod has to fit next to the old one, which is why
      # requests are well below limits.
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: joke-api
    spec:
      # Kapsule does not authenticate nodes against private Container Registry
      # namespaces, not even in the same project. The deploy task creates this
      # Secret from SCW_SECRET_KEY; it is never in git.
      imagePullSecrets:
        - name: scw-registry
      containers:
        - name: joke-api
          # Rewritten by `kustomize edit set image` in //backend:k8s-deploy; the
          # tag committed here is the tag deployed, same as the serverless
          # runtime's image_tag in live/dev/backend/terragrunt.hcl.
          image: joke-api
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: joke-api
            - secretRef:
                name: joke-api-db
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              # Mirrors the Serverless Container: 2 GB and ~1 vCPU. The
              # Dockerfile's -XX:MaxRAMPercentage=75 sizes the heap off this.
              cpu: "1"
              memory: 2Gi
          # Spring Boot plus Liquibase needs a long runway before the first
          # probe passes; liveness only starts once the startup probe succeeds.
          startupProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      # server.shutdown=graceful only helps if kubelet waits for it.
      terminationGracePeriodSeconds: 45
