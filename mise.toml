monorepo_root = true

[monorepo]
config_roots = ["iac", "backend", "frontend"]

[env]
_.file = ".env.local"

# Region/zone live in the generated provider block, not here: setting them as
# SCW_* too makes the provider warn about multiple credential sources.
# The s3 backend only reads AWS-named credentials; mirror the Scaleway pair.
AWS_ACCESS_KEY_ID     = "$SCW_ACCESS_KEY"
AWS_SECRET_ACCESS_KEY = "$SCW_SECRET_KEY"
AWS_REGION            = "fr-par"

[settings]
experimental     = true
env_shell_expand = true
